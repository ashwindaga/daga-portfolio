name: Temp scheme code lookup
on:
  push:
    branches: [tmp-code-lookup]
jobs:
  lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/lookup.py
